[project]
name = "mechinterp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.13",
  "transformer-lens>=3.7,<4",
  "transformers>=5.15",
  "einops", "jaxtyping", "numpy", "plotly", "circuitsvis",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "jupyter"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"